version: "3.8"

networks:
  healthcare-internal:
    external: true

services:
  traefik:
    image: traefik:v2.10
    container_name: healthcare-traefik
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yaml:/etc/traefik/traefik.yaml:ro
    networks:
      - healthcare-internal

  # Frontend Application (React / Vite)
  healthcare-app:
    build:
      context: ./healthcare-app
      dockerfile: Dockerfile
    container_name: healthcare-frontend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - healthcare-internal

  # Auth & User Microservice (NestJS)
  auth-service:
    build:
      context: ./healthcare-api
      dockerfile: Dockerfile
    container_name: healthcare-auth-service
    restart: unless-stopped
    env_file:
      - ./healthcare-api/.env.local
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/auth`) || PathPrefix(`/users`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.services.auth.loadbalancer.server.port=3000"
    networks:
      - healthcare-internal

  # Observability Microservice
  observability-service:
    build:
      context: ./healthcare-observability-api
      dockerfile: Dockerfile
    container_name: healthcare-observability-service
    restart: unless-stopped
    env_file:
      - ./healthcare-observability-api/.env.local
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.observability.rule=PathPrefix(`/observability`)"
      - "traefik.http.routers.observability.entrypoints=web"
      - "traefik.http.services.observability.loadbalancer.server.port=3001"
    networks:
      - healthcare-internal

  # Notification Microservice (Internal background worker / API)
  notification-service:
    build:
      context: ./healthcare-notification-api
      dockerfile: Dockerfile
    container_name: healthcare-notification-service
    restart: unless-stopped
    env_file:
      - ./healthcare-notification-api/.env.local
    labels:
      - "traefik.enable=false" # Internal only; accessed securely via container network or service key[cite: 3, 5]
    networks:
      - healthcare-internal
